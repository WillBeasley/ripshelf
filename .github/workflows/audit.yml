# Check the locked Python packages against the Python advisory database, weekly and
# whenever a lock file changes. Dependabot doesn't read the uv-made locks, so this is
# what notices a vulnerable Python package. See docs/ci-github.md.
name: audit
on:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
    paths: ["requirements*.lock"]
  pull_request:
    paths: ["requirements*.lock"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: pip-audit
        # --no-deps: the locks already list every package, pinned with hashes.
        run: |
          pipx run pip-audit --no-deps --disable-pip -r requirements.lock
          pipx run pip-audit --no-deps --disable-pip -r requirements-dev.lock
