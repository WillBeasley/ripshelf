# Tests on every push and pull request (ruff, pytest, svelte-check, the UI build, the UI's
# unit and browser tests), and a start of the image. images.yml runs these first for a
# release tag, and publishes nothing if they fail. See docs/ci-github.md.
name: test
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:
  workflow_call:
    inputs:
      image:
        description: build and start the image (images.yml does that itself, per platform)
        type: boolean
        default: true

permissions:
  contents: read

# A newer push to the same branch or pull request replaces a run still going.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-24.04
    # The image's base, so the tests run on its Python and Debian's ffmpeg, the program
    # the image transcodes with.
    container: docker.io/library/python:3.12-slim-bookworm
    timeout-minutes: 20
    steps:
      - name: Tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg mkvtoolnix tesseract-ocr tesseract-ocr-eng tesseract-ocr-osd libzbar0 git xz-utils
          useradd -m tester
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-bookworm-${{ hashFiles('requirements-dev.lock') }}
      - name: Python
        run: pip install -q --root-user-action=ignore -r requirements-dev.lock && pip install -q --root-user-action=ignore --no-deps -e .
      - name: Lint
        run: ruff check src tests
      - name: UI
        # Before the tests, so they check the built UI is served.
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build
      - name: Tests
        # As a normal user, because root ignores the file modes some tests check. The tests
        # mostly wait on fake rips, so three per core keeps the runner busy.
        run: |
          chown -R tester .
          runuser -u tester -- env COVERAGE_FILE=.coverage.linux pytest -q -n 12 --dist worksteal --cov=ripshelf --cov-report=
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-linux
          path: .coverage.linux
          include-hidden-files: true
          retention-days: 14

  ui:
    # The UI's unit tests (Vitest), then its browser tests (Playwright) against the backend
    # on the simulated drives. On the runner itself rather than in a container, because
    # Playwright installs Chromium's libraries with apt for the runner's Ubuntu.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg mkvtoolnix
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-noble-${{ hashFiles('requirements-dev.lock') }}
      - name: Python
        # Ubuntu 24.04's Python is 3.12, the image's. test/e2e/backend.sh runs .venv/bin/ripshelf.
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements-dev.lock && .venv/bin/pip install -q --no-deps -e .
      - name: Unit tests
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm test
      - name: Browser tests
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

  # Builds the image (amd64 only) without pushing it, and starts it.
  image:
    if: inputs.image != false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Names
        run: echo "CACHE_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ripshelf" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      # Only main writes the cache, which pull requests can read; a pull request's own
      # cache would hold another copy of MakeMKV's build for every one.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: localhost/ripshelf:ci
          # images.yml's registry cache too, for the stages main hasn't built lately
          # (such as MakeMKV, after the Actions cache drops it a week unused).
          cache-from: |
            type=gha,scope=ci-linux-amd64
            type=registry,ref=${{ env.CACHE_IMAGE }}:buildcache-linux-amd64
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=ci-linux-amd64,mode=max' || '' }}
      - name: Start it
        run: scripts/smoke-image.sh localhost/ripshelf:ci

  windows:
    # The whole suite on Windows, so the Windows-only code (Job Objects, drive letters,
    # volume details) meets the real kernel32 and everything else meets Windows paths,
    # file locks and encodings. MKVToolNix and Tesseract are installed where their Windows
    # installers put them, which the app has to find for itself (they aren't on the PATH),
    # and ffmpeg, which the episode splitting and its tests need. Tests of Linux-only code
    # (sysfs, SG_IO, signals, process groups, file modes) skip. There's no optical drive.
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Python
        run: |
          pip install -q -r requirements-dev.lock
          pip install -q --no-deps -e .
      - name: UI
        # Built, as start-ripshelf.bat builds it, so the tests check it's served.
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: MKVToolNix, Tesseract and ffmpeg
        run: choco install mkvtoolnix tesseract ffmpeg -y --no-progress
      - name: Tests
        env:
          COVERAGE_FILE: .coverage.windows
        run: pytest -q -n 4 --dist worksteal -rs --cov=ripshelf --cov-report=
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-windows
          path: .coverage.windows
          include-hidden-files: true
          retention-days: 14

  coverage:
    # Linux and Windows coverage together, on the run's summary page: each platform's total,
    # the files Windows covers much less of, and the combined report (HTML as an artifact).
    needs: [test, windows]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Report
        run: |
          pip install -q coverage==7.17.0
          python scripts/coverage-summary.py .coverage.linux .coverage.windows >> "$GITHUB_STEP_SUMMARY"
          python -m coverage html -d coverage-html
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage-html/
          retention-days: 14
