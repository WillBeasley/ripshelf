# Tests on every push and pull request (ruff, pytest, svelte-check). See docs/ci-github.md.
name: test
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # ffmpeg and 7z are used by the tests.
      - name: Tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg p7zip-full
      - name: Python
        run: pip install -q -r requirements-dev.lock && pip install -q --no-deps -e .
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest -q
      - name: UI
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run check
