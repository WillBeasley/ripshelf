# Tests on every push and pull request (ruff, pytest, svelte-check, the UI build, the UI's
# unit and browser tests), and a start of the image. images.yml runs these first for a
# release tag, and publishes nothing if they fail. See docs/ci-github.md.
name: test
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:
  workflow_call:
    inputs:
      image:
        description: build and start the image (images.yml does that itself, per platform)
        type: boolean
        default: true

permissions:
  contents: read

# A newer push to the same branch or pull request replaces a run still going.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-24.04
    # The image's base, so the tests run on its Python and Debian's ffmpeg, the program
    # the image transcodes with.
    container: docker.io/library/python:3.12-slim-bookworm
    timeout-minutes: 20
    steps:
      - name: Tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg mkvtoolnix tesseract-ocr tesseract-ocr-eng tesseract-ocr-osd libzbar0 git xz-utils
          useradd -m tester
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-bookworm-${{ hashFiles('requirements-dev.lock') }}
      - name: Python
        run: pip install -q --root-user-action=ignore -r requirements-dev.lock && pip install -q --root-user-action=ignore --no-deps -e .
      - name: Lint
        run: ruff check src tests
      - name: Tests
        # As a normal user, because root ignores the file modes some tests check. The tests
        # mostly wait on fake rips, so three per core keeps the runner busy.
        run: |
          chown -R tester .
          runuser -u tester -- pytest -q -n 12 --dist worksteal
      - name: UI
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build

  ui:
    # The UI's unit tests (Vitest), then its browser tests (Playwright) against the backend
    # on the simulated drives. On the runner itself rather than in a container, because
    # Playwright installs Chromium's libraries with apt for the runner's Ubuntu.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg mkvtoolnix
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-noble-${{ hashFiles('requirements-dev.lock') }}
      - name: Python
        # Ubuntu 24.04's Python is 3.12, the image's. test/e2e/backend.sh runs .venv/bin/ripshelf.
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements-dev.lock && .venv/bin/pip install -q --no-deps -e .
      - name: Unit tests
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm test
      - name: Browser tests
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

  # Builds the image (amd64 only) without pushing it, and starts it.
  image:
    if: inputs.image != false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Only main writes the cache, which pull requests can read; a pull request's own
      # cache would hold another copy of MakeMKV's build for every one.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: localhost/ripshelf:ci
          cache-from: type=gha,scope=ci-linux-amd64
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=ci-linux-amd64,mode=max' || '' }}
      - name: Start it
        run: scripts/smoke-image.sh localhost/ripshelf:ci
