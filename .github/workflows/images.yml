# Build the image for linux/amd64 and linux/arm64 and push it to GHCR, for
# release tags only, once the tests pass. See docs/ci-github.md.
#   tag vX.Y.Z      -> :X.Y.Z, :X.Y and :latest
#   tag vX.Y.Z-rc.N -> :X.Y.Z-rc.N only
# Run by hand from a tag ("Use workflow from" -> the tag) to rebuild that
# release, for example for a new MakeMKV; run from a branch, it does nothing.
# Each platform builds on its own native runner (no QEMU); a last job joins the
# two into one multi-arch tag. The image is ghcr.io/willbeasley/ripshelf.
# Nothing is pushed until test.yml's tests pass and each platform's image starts.
name: images
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}

jobs:
  test:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/test.yml
    with:
      image: false

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Names
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ripshelf" >> "$GITHUB_ENV"
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # The repository is MIT, but the image also holds MakeMKV and GPL packages.
          labels: |
            org.opencontainers.image.licenses=MIT AND LicenseRef-MakeMKV-EULA AND GPL-2.0-or-later
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Built into the local Docker first and started, then pushed from the same cache.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: localhost/ripshelf:smoke
          # The registry cache lasts from one release to the next (the Actions cache is
          # dropped after a week unused, and a tag can't read another tag's). main's
          # cache from test.yml's image job (amd64 only) fills in what it doesn't have.
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:buildcache-${{ env.PLATFORM_PAIR }}
            type=gha,scope=ci-${{ env.PLATFORM_PAIR }}
      - name: Start it
        run: scripts/smoke-image.sh localhost/ripshelf:smoke
      # Pushed by digest only; the merge job gives the digests their tags.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:buildcache-${{ env.PLATFORM_PAIR }}
            type=gha,scope=ci-${{ env.PLATFORM_PAIR }}
          # Every stage (mode=max), so the ffmpeg and MakeMKV compiles are kept too.
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ env.PLATFORM_PAIR }},mode=max,image-manifest=true,oci-mediatypes=true
      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Names
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ripshelf" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
