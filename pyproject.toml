[project]
name = "ripshelf"
version = "0.3.0"
description = "Automatic disc ripping: controller + embedded worker"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "rapidfuzz>=3.9",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "respx>=0.21", "ruff>=0.6", "pyyaml>=6"]

[project.scripts]
ripshelf = "ripshelf.main:run"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ripshelf = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.coverage.run]
branch = true
source = ["ripshelf"]
omit = ["src/ripshelf/dev/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
